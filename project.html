<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <!-- Remove this line when you take the password gate off — it
       stops search engines from indexing the site while it's
       gated. See password-gate.js for the gate itself. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Sets the theme here, before the stylesheet loads, so dark
       mode (this site's default) doesn't flash in as light for a
       moment first. site.js still owns the full theme logic (the
       toggle button, its aria state, storing changes when clicked)
       once the page finishes loading — this is just the one piece
       of it that has to happen this early to avoid the flash. -->
  <script>
    try {
      if (localStorage.getItem('theme') !== 'light') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="style.css?v=33">
</head>
<body class="gate-locked">

  <!-- ===== TEMPORARY PASSWORD GATE =====
       A soft, client-side visitor gate — see password-gate.js for
       how it works and how to turn it off yourself. Not real
       security (this is a static site, so the real page always
       ships to the browser either way) — just keeps the site from
       being stumbled on or shared before it's ready. -->
  <div id="password-gate">
    <form id="password-gate-form" class="password-gate-form">
      <label for="password-gate-input">This site is a work in progress — enter the password to continue.</label>
      <input type="password" id="password-gate-input" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Enter</button>
      <p id="password-gate-error" class="password-gate-error" role="alert"></p>
    </form>
  </div>
  <script src="password-gate.js?v=1"></script>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">dushko.art</a>

      <div class="nav-right">
        <nav class="main-nav">
          <ul>
            <li><a href="about.html">About</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== PROJECT DETAIL =====
       One template, reused for every project. Which project shows
       is decided by the ?id=... in the URL (see project.js). The
       carousel and index pages link here with the right id already
       attached, e.g. project.html?id=project-two -->
  <main class="project-detail">
    <!-- render-stage: the viewer fills 100% of the screen, everything
         else — heading included — is layered on top of it rather
         than sharing space with it. (Overlaid elements will get a
         show/hide control later.) -->
    <div class="render-stage">
      <!-- The selected render, filling the entire stage. Click (or
           Enter/Space) toggles it to fill the whole browser window —
           see project.js. -->
      <div class="render-viewer" id="render-viewer" role="button" tabindex="0" aria-pressed="false" aria-label="Expand render to fill the screen">
        <!-- Sequence position within the current project's renders —
             purely informational; navigation stays with the
             thumbnails, arrows, and keyboard. Lives here (a static
             child, not rebuilt with the backdrop/image on every
             render change — see showRender in project.js) so the
             marker can transition smoothly, and so it automatically
             follows this element's own layout on both desktop and
             mobile with no separate positioning rules needed. -->
        <div class="render-progress" id="render-progress" aria-hidden="true">
          <span class="render-progress-start" id="render-progress-start">01</span>
          <div class="render-progress-track">
            <div class="render-progress-fill" id="render-progress-fill"></div>
            <div class="render-progress-marker" id="render-progress-marker"></div>
          </div>
          <span class="render-progress-end" id="render-progress-end">01</span>
        </div>
      </div>

      <!-- Only shown while the render is expanded (see style.css) -->
      <button class="magnifier-toggle" id="magnifier-toggle" type="button" aria-pressed="false" aria-label="Turn on the image magnifier">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <div class="viewer-controls">
        <button class="viewer-fit-toggle" id="viewer-fit-toggle" type="button" aria-pressed="false" aria-label="Fit render to screen width">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4"></path>
          </svg>
        </button>
        <button class="viewer-close" id="viewer-close" type="button" aria-label="Exit fullscreen view">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="6" y1="18" x2="18" y2="6"></line>
          </svg>
        </button>
      </div>
      <!-- Lens itself is a single reused element, shown/positioned by
           project.js while magnifier mode is on. -->
      <div class="magnifier-lens" id="magnifier-lens" aria-hidden="true"></div>

      <!-- Heading, floating over the top-left corner of the image -->
      <div class="project-heading">
        <a href="index.html" class="back-link">&larr; Back to all projects</a>
        <h1 id="project-title">Project Name</h1>
      </div>

      <!-- Render picker, floating over the left side of the image -->
      <div class="render-thumb-column">
        <button class="carousel-arrow" id="render-prev" aria-label="Previous render">&uarr;</button>
        <!-- Bounded viewport: only ever holds a small fixed-size window
             of thumbnails (see getThumbWindow in project.js) and clips
             anything outside its own bounds, so a project with many
             renders can never push the stack under the header/footer. -->
        <div class="render-thumb-viewport" id="render-thumb-viewport">
          <div class="render-thumb-track" id="render-thumb-track"></div>
        </div>
        <button class="carousel-arrow" id="render-next" aria-label="Next render">&darr;</button>
      </div>

      <!-- Text panels: collapsed by default, revealed by hovering the
           handle, and kept open by clicking it (see project.js) -->
      <div class="info-toggle" id="info-toggle">
        <button class="info-handle" id="info-handle" type="button" aria-expanded="false" aria-label="Show project info">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="11" x2="12" y2="16"></line>
            <line x1="12" y1="7.5" x2="12" y2="7.5"></line>
          </svg>
        </button>

        <div class="project-panels" id="project-panels">
          <div class="project-panels-inner">
            <div class="story-panel">
              <h2>Story</h2>
              <p id="story-text"></p>
            </div>

            <div class="description-panel">
              <h2>About this render</h2>
              <p id="render-description"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Dushko Barutovski. All rights reserved.</p>
      <div class="footer-social" id="footer-social"></div>
    </div>
  </footer>

  <script src="data.js?v=3"></script>
  <script src="site.js?v=3"></script>
  <script src="project.js?v=14"></script>
</body>
</html>
